/* ==========================================================================
   GoGreen+ v2 — design system
   Type: Manrope (one family; calm, premium geometric). Colour: emblem greens.
   ========================================================================== */
:root {

  --paper: #ffffff;
  --line: rgba(16, 35, 26, .09);
  --line-strong: rgba(16, 35, 26, .16);
  --on-dark: #edf4ea;
  --on-dark-2: rgba(237, 244, 234, .72);
  --on-dark-3: rgba(237, 244, 234, .5);
  --line-dark: rgba(237, 244, 234, .13);

  --s-wet: #138a3e; --s-dry: #2457c5; --s-sanitary: #c2412d; --s-recyclable: #c9900f;

  --section: clamp(56px, 6vw, 88px);

  --shadow-soft: 0 1px 2px rgba(16,35,26,.04), 0 12px 32px -18px rgba(16,35,26,.22);

  color-scheme: light;
}

/* ==========================================================================
   Animated background shapes
   ========================================================================== */
.fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.fx > * { position: absolute; will-change: transform; }
.blob { border-radius: 50%; filter: blur(48px); opacity: .55; animation: drift 24s ease-in-out infinite alternate; }
.blob.g1 { background: radial-gradient(closest-side, rgba(163,214,95,.55), rgba(163,214,95,0)); }

.dark .blob.g1 { background: radial-gradient(closest-side, rgba(163,214,95,.22), rgba(163,214,95,0)); }
.dark .blob.g2 { background: radial-gradient(closest-side, rgba(43,160,90,.28), rgba(43,160,90,0)); }
.vec { color: var(--leaf); opacity: .085; animation: sway 20s ease-in-out infinite alternate; }
.vec.soft { filter: blur(1.5px); }
.vec.spin { animation: spin 90s linear infinite; }
.dark .vec { color: var(--sprout); opacity: .09; }
.vec svg { width: 100%; height: 100%; overflow: visible; }
@keyframes drift { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(36px,-28px,0) scale(1.08); } 100% { transform: translate3d(-24px,22px,0) scale(.96); } }
@keyframes sway { 0% { transform: translate3d(0,0,0) rotate(-7deg); } 100% { transform: translate3d(14px,-18px,0) rotate(6deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ==========================================================================

   ========================================================================== */
.hero { position: relative; isolation: isolate; min-height: 100svh; max-height: 1000px; display: flex; flex-direction: column; padding-top: var(--nav-space); overflow: hidden;

.stage .floor { position: absolute; z-index: 1; bottom: 2%; width: 66%; height: 7%; border-radius: 50%; background: radial-gradient(closest-side, rgba(16,35,26,.28), rgba(16,35,26,0)); filter: blur(6px); }

.anim .hero-copy > :nth-child(2) { animation-delay: .06s; } .anim .hero-copy > :nth-child(3) { animation-delay: .14s; } .anim .hero-copy > :nth-child(4) { animation-delay: .22s; }

}

.ev-date span { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-top: 4px; }
.event { grid-template-columns: 64px minmax(0, 1fr); }

/* ==========================================================================

   ========================================================================== */
@supports (animation-timeline: view()) {
  .rv { animation: rv linear both; animation-timeline: view(); animation-range: entry 0% entry 70%; }
  @keyframes rv { from { opacity: 0; transform: translateY(28px) scale(.985); } to { opacity: 1; transform: none; } }
}
#app.is-entering { animation: pageIn .5s var(--ease) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .rv { animation: none !important; }
}

V.notFound = (h = "Page Not Found", s = "The page you're looking for doesn't exist.") => ({
  title: `${h} | GoGreen+`, nav: "",
  html: `<section class="soon">${fx("soon")}<div style="position:relative"><span class="eyebrow">404</span><h1 class="h1">${h}</h1><p class="lead">${s}</p><div class="actions"><a class="btn btn-primary" href="#/">Go Home${arrow()}</a></div></div></section>`,
});

/* ==========================================================================
   Behaviours
   ========================================================================== */
let cleanups = [];
function initTabs(root) {
  $$("[data-tabs]", root).forEach((w) => {

    const sel = (i, f) => { tabs.forEach((t, k) => { t.setAttribute("aria-selected", k === i); t.tabIndex = k === i ? 0 : -1; }); panels.forEach((p, k) => { p.hidden = k !== i; if (k === i) { p.classList.remove("is-in"); void p.offsetWidth; p.classList.add("is-in"); } }); if (f) tabs[i].focus(); };

    $$("[data-item]", root).forEach((j) => { const ok = (!term || j.dataset.text.includes(term)) && (t === "all" || j.dataset.type === t); j.hidden = !ok; if (ok) n++; });
    if (count) count.textContent = `Showing ${n} ${noun}${n !== 1 ? "s" : ""}${term ? ` for "${q.value.trim()}"` : ""}`; empty.hidden = n !== 0; };

/* ---------- global interactions ---------- */
function moveGlide(el) {

const activeNavEl = () => $(".nav-track [data-nav][aria-current='page']");
function initChrome() {
  const items = $$(".nav-item");
  const close = () => items.forEach((it) => { it.classList.remove("is-open"); $("button", it).setAttribute("aria-expanded", "false"); });
  items.forEach((it) => {
    const b = $("button", it); let t;

    b.addEventListener("click", () => open(!it.classList.contains("is-open")));
    if (matchMedia("(hover: hover)").matches) { it.addEventListener("mouseenter", () => { clearTimeout(t); open(true); }); it.addEventListener("mouseleave", () => { t = setTimeout(() => open(false), 160); }); }
  });

  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { close(); closeDrawer(); } });
  const track = $(".nav-track");
  $$(".nav-a", track).forEach((a) => a.addEventListener("mouseenter", () => moveGlide(a)));
  track.addEventListener("mouseleave", () => moveGlide(activeNavEl()));
  addEventListener("resize", () => moveGlide(activeNavEl()));
  const tog = $(".nav-toggle"), dr = $("#drawer");
  tog.addEventListener("click", () => { const o = !dr.classList.contains("is-open"); dr.classList.toggle("is-open", o); tog.setAttribute("aria-expanded", o); tog.innerHTML = ic(o ? "close" : "menu"); document.body.style.overflow = o ? "hidden" : ""; });

function closeDrawer() { const dr = $("#drawer"), t = $(".nav-toggle"); dr.classList.remove("is-open"); if (t) { t.setAttribute("aria-expanded", "false"); t.innerHTML = ic("menu"); } document.body.style.overflow = ""; }

/* ==========================================================================
   Router
   ========================================================================== */
const ALIAS = {
  "/product-and-services": "/services", "/solutions": "/services", "/corporate-responsibility": "/responsibility", "/community-impact": "/impact",
  "/careers": "/careers/job-search", "/careers/students/internships": "/careers/internships", "/careers/students/events": "/careers/events",
  "/dashboard": "/book", "/contact": "/book", "/book-now": "/book",
};
const ROUTES = [
  [/^\/$/, () => V.home()],
  [/^\/services$/, () => V.services()],
  [/^\/(?:services|product|solutions)\/([\w-]+)$/, (m) => V.product(m[1])],
  [/^\/responsibility$/, () => V.responsibility()],
  [/^\/impact$/, () => V.soon("Community Impact", "impact")],
  [/^\/media$/, () => V.soon("Media", "")],
  [/^\/about$/, () => V.about()],
  [/^\/about\/([\w-]+)$/, (m) => V.profile(m[1])],
  [/^\/careers\/([\w-]+)$/, (m) => V.careers(m[1])],
  [/^\/book$/, () => V.book()],
  [/^\/login$/, () => V.login()],
];
let first = true;
function render() {
  let path = (location.hash.replace(/^#/, "") || "/").replace(/\/+$/, "") || "/";
  if (ALIAS[path]) path = ALIAS[path];
  const hit = ROUTES.find(([re]) => re.test(path));
  const view = hit ? hit[1](path.match(hit[0])) : V.notFound();
  cleanups.forEach((f) => f()); cleanups = [];
  const app = $("#app");
  app.innerHTML = view.html;
  document.title = view.title;
  $("#site-footer").hidden = !!view.noFooter;
  $$("[data-nav]").forEach((a) => a.dataset.nav === view.nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $$(".nav-item").forEach((it) => { it.classList.remove("is-open"); $("button", it).setAttribute("aria-expanded", "false"); });
  closeDrawer();
  document.documentElement.classList.toggle("anim", first && view.nav === "home" && !REDUCED);
  (view.after || []).forEach((fn) => fn(app));
  let j = null; try { j = sessionStorage.getItem("gg-jump"); sessionStorage.removeItem("gg-jump"); } catch (_) { j = window.__j; window.__j = null; }
  if (j) requestAnimationFrame(() => setTimeout(() => jumpTo(j, false), 40)); else scrollTo(0, 0);

}
function router() {

  else render();
}
document.addEventListener("DOMContentLoaded", () => {

  addEventListener("hashchange", router);
